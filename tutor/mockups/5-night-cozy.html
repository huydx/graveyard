<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup 5 — Night Cozy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #1a1a2e;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .wrapper {
    width: 900px; max-width: 100%; height: 640px;
    display: flex; border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.40), 0 0 0 1px #ffffff0a;
  }

  /* ── Left Pane ── */
  .left-pane {
    width: 82px; min-width: 82px;
    background: #16213e;
    border-right: 1px solid #ffffff10;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 0 16px; gap: 18px;
  }
  .input-btn {
    width: 54px; height: 54px; border-radius: 16px;
    border: 1px solid #ffffff15; background: #1a2744;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer; transition: 0.2s;
    color: #8e99b0;
  }
  .input-btn.active {
    background: #3d2e5c; border-color: #c9a0ff;
    color: #e0c8ff;
    box-shadow: 0 0 16px #c9a0ff33, 0 0 0 2px #c9a0ff22;
  }
  .input-btn:hover { border-color: #ffffff30; color: #c9d0e0; }
  .spacer { flex: 1; }

  /* ── Right Pane ── */
  .right-pane {
    flex: 1; background: #1a1a2e;
    display: flex; flex-direction: column;
    position: relative;
    background-image:
      radial-gradient(ellipse at 50% 20%, #2d1f4a22 0%, transparent 70%),
      radial-gradient(ellipse at 80% 80%, #1e2a3a33 0%, transparent 60%);
  }
  .chat-area {
    flex: 1; overflow-y: auto;
    padding: 22px 24px; display: flex; flex-direction: column; gap: 14px;
  }

  /* ── Bubbles ── */
  .bubble {
    max-width: 76%; padding: 14px 18px; border-radius: 20px;
    font-size: 17px; line-height: 1.5;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .bubble.ai {
    align-self: flex-start; background: #1e2a3a; color: #d0d8e8;
    border-bottom-left-radius: 6px;
    border: 1px solid #ffffff10;
  }
  .bubble.kid {
    align-self: flex-end; background: #3d2e5c; color: #e8dcff;
    border-bottom-right-radius: 6px;
    border: 1px solid #c9a0ff22;
  }
  .bubble.kid.voice { background: #2a3d4f; color: #c8e6ff; border-color: #64b5f644; }

  /* ── Exercise Card ── */
  .exercise-card {
    align-self: stretch; background: #1e2a3a;
    border: 1px solid #ffffff12; border-radius: 20px;
    padding: 22px; margin: 4px 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.20);
  }
  .exercise-card .problem {
    font-size: 32px; font-weight: 700; text-align: center;
    margin: 10px 0; color: #ffe8a0; letter-spacing: 3px;
    text-shadow: 0 0 20px #ffa00044;
  }
  .exercise-card .feedback {
    text-align: center; font-size: 15px; color: #c9a0ff;
    margin-top: 8px; font-weight: 600;
  }

  /* ── Thinking / Loading ── */
  .thinking {
    align-self: flex-start; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: #1e2a3a; border: 1px solid #ffffff10;
    border-radius: 20px; border-bottom-left-radius: 6px;
  }
  .mascot { font-size: 34px; animation: gentleFloat 1.5s infinite alternate ease-in-out; }
  @keyframes gentleFloat { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  .dots { display: flex; gap: 4px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; animation: glow 1.2s infinite; }
  .dots span:nth-child(1) { background: #ff9a9e; }
  .dots span:nth-child(2) { background: #ffd4a8; animation-delay: 0.2s; }
  .dots span:nth-child(3) { background: #c9a0ff; animation-delay: 0.4s; }
  @keyframes glow { 0%,60% { opacity: 0.3; box-shadow: none; } 100% { opacity: 1; box-shadow: 0 0 8px currentColor; } }

  /* ── Gear ── */
  .gear {
    position: absolute; bottom: 16px; right: 16px;
    width: 34px; height: 34px; border-radius: 50%;
    background: #16213e; border: 1px solid #ffffff15;
    font-size: 16px; cursor: pointer; opacity: 0.35;
    display: flex; align-items: center; justify-content: center;
    color: #8e99b0; transition: opacity 0.2s;
  }
  .gear:hover { opacity: 0.85; }

  .mockup-label {
    text-align: center; margin-top: 12px; font-size: 13px;
    color: #8e99b0; letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;align-items:center;">
<div class="wrapper">

  <div class="left-pane">
    <div class="input-btn active" title="Voice">🎤</div>
    <div class="input-btn" title="Camera">📷</div>
    <div class="input-btn" title="Keyboard">⌨</div>
    <div class="spacer"></div>
  </div>

  <div class="right-pane">
    <div class="chat-area">
      <div class="bubble ai">
        こんばんは！きょうも いっしょに がんばろうね 🌙
      </div>
      <div class="bubble kid voice">
        さんすう やりたい！
      </div>
      <div class="bubble ai">
        いいね！じゃあ たしざんの もんだいを だすね。よるの べんきょうも たのしいね 🐻
      </div>

      <div class="exercise-card">
        <div style="font-size:12px;color:#c9a0ff;font-weight:600;">✦ もんだい ✦</div>
        <div class="problem">3 + 5 = ？</div>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;">
          <span style="background:#16213e;border:1px solid #ffffff18;padding:10px 20px;border-radius:14px;font-size:20px;cursor:pointer;color:#d0d8e8;">4</span>
          <span style="background:#16213e;border:1px solid #ffffff18;padding:10px 20px;border-radius:14px;font-size:20px;cursor:pointer;color:#d0d8e8;">7</span>
          <span style="background:#16213e;border:1px solid #ffffff18;padding:10px 20px;border-radius:14px;font-size:20px;cursor:pointer;color:#d0d8e8;">8</span>
          <span style="background:#16213e;border:1px solid #ffffff18;padding:10px 20px;border-radius:14px;font-size:20px;cursor:pointer;color:#d0d8e8;">9</span>
        </div>
        <div class="feedback">こたえを タップしてね ✨</div>
      </div>

      <div class="thinking">
        <span class="mascot">🐻</span>
        <div class="dots">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="bubble ai">
        <strong>ピンポン！せいかい！</strong> ⭐<br>
        3 + 5 = 8 だね。すごい！
      </div>
      <div class="bubble ai">
        つぎは 7 + 2 に ちょうせん！
      </div>
    </div>

    <button class="gear">⚙</button>
  </div>
</div>
<div class="mockup-label">Mockup 5 — Night Cozy</div>
</div>
</body>
</html>
